# CI for the generated example app (examples/DailyQuotes).
# This is the automated proof that the generated app actually compiles + tests pass.
# It lives at the repo root because GitHub Actions only reads .github/workflows/ here;
# the app itself is in a subdirectory, so every Gradle step runs with working-directory.
name: DailyQuotes CI

on:
  push:
    branches: ["**"]
    paths:
      - "examples/DailyQuotes/**"
      - ".github/workflows/dailyquotes-ci.yml"
  pull_request:
    paths:
      - "examples/DailyQuotes/**"
      - ".github/workflows/dailyquotes-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: examples/DailyQuotes

jobs:
  build:
    name: Build, test & lint (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (accepts licenses, ensures platform tools)
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Lint shouldn't gate the green signal for this demo; build + tests do.
      - name: Lint
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dailyquotes-reports
          path: |
            examples/DailyQuotes/app/build/reports/
            examples/DailyQuotes/app/build/test-results/
          retention-days: 7
